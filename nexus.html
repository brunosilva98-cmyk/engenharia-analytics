<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão integrada de projetos | Projeto Atlas</title><style>
:root{--bg:#10191a;--sidebar:#132325;--panel:#1b2b2c;--panel2:#223638;--line:#385051;--text:#edf4ed;--muted:#a1b7af;--lime:#c9ef72;--mint:#70d5b2;--gold:#e5b66b;--coral:#ef8d7d;--steel:#86aeb6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui,'Segoe UI',sans-serif}button,select{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:242px;background:linear-gradient(155deg,#1a3231,#101e20);border-right:1px solid var(--line);padding:25px 14px;display:flex;flex-direction:column;z-index:3}.logo{font-weight:900;font-size:25px;letter-spacing:3px;padding:0 12px}.logo b{color:var(--lime)}.tiny{font-size:10px;letter-spacing:2px;color:#8fac9f;padding:5px 12px 26px}.group{font-size:10px;letter-spacing:1.6px;color:#829b92;margin:18px 12px 8px}.nav{display:flex;gap:11px;align-items:center;width:100%;border:0;background:none;color:#b8ccc3;padding:11px 12px;text-align:left;border-radius:10px;margin:2px 0}.nav:hover,.nav.on{background:#2c4845;color:white}.nav.on{box-shadow:inset 3px 0 var(--lime)}.nav span{color:var(--lime);font-size:17px;width:20px}.foot{margin-top:auto;color:#8fa99e;font-size:11px;padding:12px;border-top:1px solid var(--line);line-height:1.8}main{margin-left:242px;padding:28px 30px;max-width:1800px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.eyebrow{color:var(--lime);letter-spacing:2px;font-size:10px;font-weight:800}.head h1{font-size:28px;margin:7px 0}.sub{color:var(--muted)}.pill{padding:9px 13px;border:1px solid #577460;border-radius:25px;color:var(--lime);font-size:11px;background:#294139}.hero{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:23px 26px;border:1px solid #4b6a57;border-radius:17px;background:radial-gradient(circle at 85% 20%,#486a47 0,transparent 30%),linear-gradient(100deg,#2a473e,#1c3435);margin-bottom:17px}.hero h2{font-size:24px;margin:5px 0}.hero p{color:#b6cbbd;margin:0}.hero strong{font-size:31px;color:var(--lime)}.grid{display:grid;gap:15px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:15px}.two{grid-template-columns:1.5fr 1fr;margin-bottom:15px}.equal{grid-template-columns:1fr 1fr;margin-bottom:15px}.three{grid-template-columns:repeat(3,1fr);margin-bottom:15px}.card{background:linear-gradient(155deg,#203335,#19292b);border:1px solid var(--line);border-radius:15px;padding:18px;min-width:0;overflow:hidden}.card h3{margin:0 0 5px;font-size:15px}.hint{color:var(--muted);font-size:11px;margin:0 0 16px}.kpi{min-height:110px}.klabel{font-size:11px;color:var(--muted)}.num{font-size:27px;font-weight:850;margin:10px 0 5px;color:var(--lime)}.detail{font-size:11px;color:#a6bfb1}.positive{color:var(--mint)}.negative{color:var(--coral)}.warning{color:var(--gold)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:540px}td,th{padding:12px 11px;text-align:left;border-bottom:1px solid #365052;font-size:12px}th{background:#2a4142;color:#a9c2b6;font-size:10px;letter-spacing:.6px;text-transform:uppercase}td{color:#d9e7de}tr:hover td{background:#294043}.tag{display:inline-block;border-radius:6px;padding:4px 8px;background:#2e5446;color:#a7edc3;font-size:10px;font-weight:700}.tag.alert{background:#563a3b;color:#ffaaa0}.tag.mid{background:#564a31;color:#f7d391}.bar{height:9px;background:#3a5351;border-radius:8px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--lime));border-radius:8px}.barline{display:grid;grid-template-columns:145px 1fr 50px;gap:12px;align-items:center;margin:14px 0;font-size:12px}.chart{display:block;width:100%;height:260px}.legend{display:flex;gap:17px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:12px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.metric{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}.metric span{color:var(--muted)}.metric strong{white-space:nowrap}.modelWrap{height:430px;position:relative;border:1px solid #41615c;border-radius:13px;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#35504a,#1a2b2c 70%);touch-action:none;cursor:grab}.modelWrap:active{cursor:grabbing}.modelWrap svg{width:100%;height:100%;display:block}.modelHint{position:absolute;bottom:12px;left:13px;font-size:11px;color:#c5d9c9;background:#162b2cbb;padding:7px 10px;border-radius:7px;pointer-events:none}.modelTools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.tool{border:1px solid #4c6861;border-radius:8px;background:#294440;color:#e5f0e5;padding:9px 11px}.tool.active{border-color:var(--lime);color:var(--lime)}.stage{color:var(--lime);font-size:11px}.callout{padding:12px 14px;border-left:3px solid var(--lime);background:#294039;border-radius:6px;color:#c7ddce;font-size:12px;line-height:1.7}.footer{text-align:right;font-size:10px;color:#78988c;margin:23px 0}.select{background:#29433e;color:#fff;border:1px solid #507065;padding:8px 12px;border-radius:9px}@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.two,.equal,.three{grid-template-columns:1fr}}@media(max-width:750px){aside{position:relative;width:100%;padding:12px}.tiny,.group,.foot{display:none}.navlist{display:flex;overflow:auto}.nav{white-space:nowrap;font-size:11px}.nav span{display:none}main{margin:0;padding:15px}.head{flex-direction:column;align-items:flex-start}.hero h2{font-size:19px}.hero strong{font-size:21px}.card{padding:13px}.modelWrap{height:340px}}
</style></head><body><aside><div class="logo">NE<b>X</b>US</div><div class="tiny">INDUSTRIAL INTELLIGENCE</div><div class="navlist" id="nav"></div><div class="foot">PROJETO ATLAS · FM-240<br><span style="color:var(--lime)">●</span> Dados locais integrados<br>Ambiente de engenharia</div></aside><main><div class="head"><div><div class="eyebrow">ENGINEERING OPERATIONS / 2026</div><h1 id="title">Centro de comando</h1><div class="sub">Projeto Atlas · Sistema de despoeiramento industrial</div></div><div style="display:flex;gap:10px;align-items:center"><span class="pill">● CONTROLE ATIVO</span><select id="period" class="select"><option value="10">Outubro 2026</option><option value="9">Setembro 2026</option><option value="8">Agosto 2026</option></select></div></div><div id="page"></div><div class="footer">Gestão integrada de projetos · Gestão de operações de engenharia</div></main>
<script>
'use strict';const colors={lime:'#c9ef72',mint:'#70d5b2',gold:'#e5b66b',coral:'#ef8d7d',steel:'#86aeb6',grid:'#385051',text:'#a1b7af'};const navs=[['overview','◈','Centro de comando'],['model','⬡','Modelo tridimensional'],['schedule','▤','Planejamento integrado'],['progress','◫','Avanço e produtividade'],['engineering','◇','Engenharia técnica'],['supply','▣','Suprimentos'],['quality','✦','Qualidade e inspeções'],['safety','⬟','Segurança operacional'],['cost','◉','Custos e medições'],['risks','⚑','Riscos e restrições'],['handover','✓','Comissionamento']];let current='overview',period=10,angle=-24,tilt=12,zoom=1,exploded=false,selected='all';const stages=[['Engenharia',100,100,10],['Fundações',100,100,13],['Estrutura metálica',91,86,19],['Corpo filtrante',82,76,23],['Dutos e ventiladores',71,64,15],['Elétrica e automação',54,48,12],['Testes e partida',12,5,8]];const activities=[['Projetos executivos','Engenharia','02/02','30/04',100],['Bases e chumbadores','Civil','16/03','29/05',100],['Pórticos e plataformas','Estruturas','18/05','30/09',86],['Moegas e tremonhas','Caldeiraria','08/06','16/10',88],['Carcaça do filtro','Caldeiraria','22/06','06/11',79],['Gaiolas e mangas filtrantes','Mecânica','17/08','20/11',68],['Dutos de captação','Tubulação','03/08','04/12',64],['Ventilador centrífugo','Mecânica','21/09','11/12',61],['Painel de comando','Elétrica','05/10','08/01',48],['Instrumentação de pressão','Automação','19/10','15/01',31],['Teste de estanqueidade','Qualidade','11/01','29/01',0],['Partida assistida','Comissionamento','01/02','19/02',0]];const suppliers=[['Mangas filtrantes','Em entrega',82],['Gaiolas metálicas','Recebido parcialmente',91],['Ventilador centrífugo','Inspeção de fábrica',74],['Válvulas de pulso','Em trânsito',88],['Painéis de automação','Em fabricação',57],['Dutos galvanizados','Entrega progressiva',69]];const fmt=(v,d=1)=>Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});const tag=(s)=>`<span class="tag ${/Alto|Crít|Atras/.test(s)?'alert':/Médio|Atenção/.test(s)?'mid':''}">${s}</span>`;const prog=n=>`<div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:${n}%"></i></div><b>${n}%</b></div>`;const kpi=(name,value,desc,tone='')=>`<div class="card kpi"><div class="klabel">${name}</div><div class="num ${tone}">${value}</div><div class="detail">${desc}</div></div>`;const card=(name,desc,body)=>`<div class="card"><h3>${name}</h3><p class="hint">${desc}</p>${body}</div>`;const table=(head,rows)=>`<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;const bars=items=>items.map(x=>`<div class="barline"><span>${x[0]}</span><div class="bar"><i style="width:${x[1]}%"></i></div><b>${x[1]}%</b></div>`).join('');const metric=(a,b)=>`<div class="metric"><span>${a}</span><strong>${b}</strong></div>`;const legend=(items)=>`<div class="legend">${items.map(x=>`<span><i style="background:${x[1]}"></i>${x[0]}</span>`).join('')}</div>`;
function line(series,labels,max=100){let w=740,h=260,L=43,T=15,W=675,H=208,s=`<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">`;for(let i=0;i<=4;i++){let y=T+i*H/4;s+=`<line x1="${L}" x2="${L+W}" y1="${y}" y2="${y}" stroke="${colors.grid}" stroke-dasharray="4 5"/><text x="${L-8}" y="${y+4}" fill="${colors.text}" font-size="11" text-anchor="end">${Math.round(max*(4-i)/4)}</text>`}labels.forEach((x,i)=>{let xx=L+i*W/(labels.length-1);s+=`<text x="${xx}" y="250" fill="${colors.text}" font-size="11" text-anchor="middle">${x}</text>`});series.forEach((ss,ii)=>{let pts=ss.values.map((v,i)=>[L+i*W/(labels.length-1),T+H*(1-v/max)]),d=pts.map((p,i)=>(i?'L':'M')+p.join(',')).join(' ');s+=`<path d="${d}" fill="none" stroke="${ss.color}" stroke-width="3"/>`;pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${ss.color}"/>`)});return s+'</svg>'}function columns(labels,values){let w=740,h=260,L=35,T=15,W=680,H=205,max=Math.max(...values)*1.22,s=`<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">`;values.forEach((v,i)=>{let x=L+(i+.2)*W/values.length,bw=.6*W/values.length,bh=v/max*H;s+=`<rect x="${x}" y="${T+H-bh}" width="${bw}" height="${bh}" rx="5" fill="${[colors.mint,colors.lime,colors.steel][i%3]}"/><text x="${x+bw/2}" y="${T+H-bh-7}" fill="#d7e7d8" font-size="11" text-anchor="middle">${v}</text><text x="${x+bw/2}" y="245" fill="${colors.text}" font-size="11" text-anchor="middle">${labels[i]}</text>`});return s+'</svg>'}
const labels=['Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez','Jan','Fev'];const planned=[2,7,13,21,31,42,53,63,73,83,92,97,100],actual=[2,7,12,20,29,39,48,57,66];const idx=()=>period-2;
function overview(){let i=idx();return `<div class="hero"><div><div class="eyebrow">PROJETO ATLAS / FM-240</div><h2>Sistema de filtragem de particulados</h2><p>Filtro de mangas industrial · 48.000 m³/h · 240 elementos filtrantes</p></div><strong>${actual[i]}%<div style="font-size:11px;color:#b7cebd;text-align:right">EXECUÇÃO ACUMULADA</div></strong></div><div class="grid kpis">${kpi('Avanço físico',actual[i]+'%','Executado acumulado')}${kpi('Planejamento',planned[i]+'%','Meta acumulada')}${kpi('Desvio',actual[i]-planned[i]+' p.p.','Diferença em relação à linha de base','negative')}${kpi('Orçamento','R$ 18,4 mi','CAPEX referencial')}</div><div class="grid two">${card('Curva S do empreendimento','Planejado × realizado • avanço físico acumulado',line([{values:planned,color:colors.lime},{values:actual.slice(0,i+1),color:colors.mint}],labels)+legend([['Planejado',colors.lime],['Realizado',colors.mint]]))}${card('Desempenho por sistema','Avanço por disciplina',bars(stages.map(x=>[x[0],x[2]])))}</div><div class="grid equal">${card('Pacotes críticos','Condições de fornecimento',table(['Pacote','Situação','Avanço'],suppliers.slice(0,4).map(x=>[x[0],x[1],prog(x[2])]))) }${card('Prioridades da semana','Monitoramento de execução',metric('Montagem do corpo filtrante',tag('Atenção'))+metric('Entrega de válvulas de pulso',tag('Regular'))+metric('Liberação de plataformas',tag('Regular'))+metric('Testes elétricos preliminares',tag('Atenção')))}</div>`}
function model(){return `<div class="grid kpis">${kpi('Vazão nominal','48.000 m³/h','Sistema de exaustão')}${kpi('Elementos filtrantes','240 mangas','10 conjuntos de 24')}${kpi('Área de filtragem','1.440 m²','Área efetiva de referência')}${kpi('Montagem do filtro','76%','Progresso do corpo filtrante')}</div><div class="grid two">${card('Modelo 3D interativo','Arraste para girar • role para ampliar • selecione componentes',`<div class="modelTools"><button class="tool active" data-part="all">Conjunto completo</button><button class="tool" data-part="housing">Corpo</button><button class="tool" data-part="hopper">Tremonhas</button><button class="tool" data-part="duct">Dutos</button><button class="tool" data-part="fan">Ventilador</button><button class="tool" id="explode">Vista explodida</button><button class="tool" id="reset">Restaurar</button></div><div class="modelWrap" id="modelWrap"><svg id="modelSvg" viewBox="0 0 820 460" aria-label="Modelo tridimensional esquemático do filtro de mangas"></svg><div class="modelHint">⤾ Arraste para orbitar · Scroll para zoom</div></div>`)}${card('Ficha de engenharia','Parâmetros de concepção do equipamento',metric('Equipamento','Filtro de mangas tipo pulse-jet')+metric('Identificação','FM-240')+metric('Capacidade nominal','48.000 m³/h')+metric('Número de câmaras','4')+metric('Mangas por câmara','60')+metric('Dimensões de referência','12,0 × 5,0 × 13,5 m')+metric('Material da carcaça','Aço carbono')+metric('Pressão diferencial alvo','1.000–1.500 Pa')+`<div class="callout" style="margin-top:16px">Visualização geométrica conceitual para acompanhamento executivo. Não constitui modelo BIM, desenho de fabricação ou dimensionamento validado.</div>`)}</div><div class="grid equal">${card('Montagem por subconjunto','Progresso de instalação',bars([['Estrutura de suporte',92],['Tremonhas',88],['Carcaça',79],['Gaiolas e mangas',68],['Dutos',64],['Ventilador',61]]))}${card('Pontos de inspeção','Verificações programadas',table(['Verificação','Previsão','Status'],[['Alinhamento estrutural','Out/2026',tag('Regular')],['Estanqueidade de carcaça','Jan/2027',tag('Pendente')],['Instalação das mangas','Dez/2026',tag('Atenção')],['Balanceamento do rotor','Jan/2027',tag('Pendente')]]))}</div>`}
function schedule(){return `<div class="grid kpis">${kpi('Atividades','12','Pacotes principais')}${kpi('Concluídas','2','Atividades finalizadas')}${kpi('Em execução','8','Frentes ativas')}${kpi('Conclusão','19/02/2027','Marco contratual')}</div>${card('Cronograma mestre','Sequenciamento e controle de progresso',table(['Atividade','Disciplina','Início','Término','Execução'],activities.map(x=>[x[0],x[1],x[2],x[3],prog(x[4])]))) }<div class="grid equal" style="margin-top:15px">${card('Marcos executivos','Entregas prioritárias',metric('Carcaça instalada','Nov/2026')+metric('Sistema de dutos','Dez/2026')+metric('Energização dos painéis','Jan/2027')+metric('Partida assistida','Fev/2027'))}${card('Plano de recuperação','Ações de curto prazo',metric('Reforço de montagem',tag('Regular'))+metric('Sequência de dutos',tag('Atenção'))+metric('Liberação de acesso',tag('Regular')))}</div>`}
function progress(){let i=idx();return `<div class="grid kpis">${kpi('Avanço previsto',planned[i]+'%','Linha de base')}${kpi('Avanço realizado',actual[i]+'%','Medição física')}${kpi('Desvio',actual[i]-planned[i]+' p.p.','Variação acumulada','negative')}${kpi('Produtividade','92,4%','Índice de referência')}</div><div class="grid two">${card('Curva física acumulada','Previsto × realizado',line([{values:planned,color:colors.lime},{values:actual.slice(0,i+1),color:colors.mint}],labels)+legend([['Previsto',colors.lime],['Realizado',colors.mint]]))}${card('Avanço por frente','Desempenho atual',bars(stages.map(x=>[x[0],x[2]])))}</div>${card('Matriz de produção','Pesos e avanço por pacote',table(['Frente','Peso EAP','Planejado','Realizado','Variação'],stages.map(x=>[x[0],x[3]+'%',x[1]+'%',prog(x[2]),`<span class="${x[2]-x[1]<0?'negative':'positive'}">${x[2]-x[1]} p.p.</span>`])))}`}
function engineering(){let docs=[['Mecânica',94,87],['Civil',63,63],['Elétrica',72,65],['Automação',49,40],['Instrumentação',38,32]];return `<div class="grid kpis">${kpi('Documentos previstos','316','Pacote de engenharia')}${kpi('Documentos emitidos','287','90,8% do previsto')}${kpi('Documentos aprovados','263','91,6% dos emitidos')}${kpi('Pendências técnicas','24','Em análise','warning')}</div><div class="grid equal">${card('Emissão por disciplina','Documentos emitidos',columns(docs.map(x=>x[0]),docs.map(x=>x[2])))}${card('Atendimento documental','Percentual emitido',bars(docs.map(x=>[x[0],Math.round(x[2]/x[1]*100)])))}</div>${card('Lista de disciplinas','Controle de documentação',table(['Disciplina','Previstos','Emitidos','Atendimento'],docs.map(x=>[x[0],x[1],x[2],prog(Math.round(x[2]/x[1]*100))])))}`}
function supply(){return `<div class="grid kpis">${kpi('Pacotes ativos','18','Compras e contratos')}${kpi('Pedidos colocados','17','94,4% de cobertura')}${kpi('Entregas concluídas','11','61,1% dos pacotes')}${kpi('Itens monitorados','3','Atenção logística','warning')}</div><div class="grid equal">${card('Maturidade de suprimentos','Progresso dos pacotes',bars(suppliers.map(x=>[x[0],x[2]])))}${card('Entregas por mês','Pacotes recebidos',columns(['Jun','Jul','Ago','Set','Out'],[1,2,2,3,3]))}</div>${card('Mapa de fornecimentos','Acompanhamento de equipamentos e materiais',table(['Pacote','Status','Progresso'],suppliers.map(x=>[x[0],x[1],prog(x[2])])))}`}
function quality(){return `<div class="grid kpis">${kpi('Inspeções previstas','86','Plano de inspeção e testes')}${kpi('Inspeções realizadas','67','77,9% do plano')}${kpi('Conformidades','63','94,0% das inspeções','positive')}${kpi('Não conformidades','4','2 abertas','warning')}</div><div class="grid equal">${card('Inspeções por área','Quantidade concluída',columns(['Civil','Estrut.','Mec.','Elét.','Instr.'],[18,19,15,10,5]))}${card('Situação de qualidade','Tratativas principais',metric('Rastreabilidade de soldas',tag('Regular'))+metric('Pintura de carcaça',tag('Atenção'))+metric('Certificados de materiais',tag('Regular'))+metric('Inspeção dimensional',tag('Regular')))}</div>${card('Plano de inspeção','Pontos de controle e registros',table(['Verificação','Disciplina','Responsável','Situação'],[['Dimensional de tremonhas','Caldeiraria','Qualidade',tag('Regular')],['Inspeção de solda','Estruturas','Qualidade',tag('Regular')],['Revestimento anticorrosivo','Pintura','Qualidade',tag('Atenção')],['Teste de estanqueidade','Mecânica','Comissionamento',tag('Pendente')]]))}`}
function safety(){return `<div class="grid kpis">${kpi('HH trabalhadas','142.800','Acumulado da obra')}${kpi('Dias sem afastamento','176','Registro operacional','positive')}${kpi('Inspeções de campo','92','Verificações executadas')}${kpi('Desvios em aberto','3','Planos de ação','warning')}</div><div class="grid equal">${card('Inspeções mensais','Histórico de verificações',columns(['Jun','Jul','Ago','Set','Out'],[12,15,18,22,25]))}${card('Controles críticos','Status das frentes',metric('Trabalho em altura',tag('Regular'))+metric('Içamento de cargas',tag('Atenção'))+metric('Bloqueio e etiquetagem',tag('Regular'))+metric('Espaços confinados',tag('Regular')))}</div>${card('Plano preventivo','Acompanhamento de ações',table(['Ação','Prazo','Situação'],[['Revisar plano de rigging','06/11',tag('Atenção')],['Treinamento de acesso elevado','12/11',tag('Regular')],['Inspeção de linhas de vida','18/11',tag('Regular')]]))}`}
function cost(){let i=idx();let pv=[1,4,9,16,26,38,49,61,73,84,92,97,100],rv=[1,4,8,15,24,35,45,55,65];return `<div class="grid kpis">${kpi('Orçamento global','R$ 18,4 mi','CAPEX referencial')}${kpi('Previsto acumulado',fmt(pv[i])+'%','Curva financeira')}${kpi('Realizado acumulado',fmt(rv[i])+'%','Medição financeira')}${kpi('Variação',rv[i]-pv[i]+' p.p.','Desvio acumulado','negative')}</div><div class="grid equal">${card('Curva financeira','Percentual acumulado',line([{values:pv,color:colors.lime},{values:rv.slice(0,i+1),color:colors.mint}],labels)+legend([['Previsto',colors.lime],['Realizado',colors.mint]]))}${card('Medição mensal','Receita em R$ milhões',columns(['Jun','Jul','Ago','Set','Out'],[1.65,2.02,1.84,1.84,1.84]))}</div>${card('Composição do investimento','Distribuição por pacote',table(['Pacote','Participação','Valor (R$ mi)'],[['Engenharia','10%','1,84'],['Civil e bases','13%','2,39'],['Estrutura e carcaça','42%','7,73'],['Dutos e ventilação','15%','2,76'],['Elétrica e automação','12%','2,21'],['Comissionamento','8%','1,47']]))}`}
function risks(){return `<div class="grid kpis">${kpi('Restrições ativas','7','Acompanhamento integrado')}${kpi('Alta criticidade','2','Prioridade imediata','negative')}${kpi('Média criticidade','3','Ações em curso','warning')}${kpi('Baixa criticidade','2','Monitoramento')}</div><div class="grid equal">${card('Distribuição de riscos','Por classificação',columns(['Alta','Média','Baixa'],[2,3,2]))}${card('Plano de resposta','Principais medidas',metric('Reprogramação de montagem',tag('Atenção'))+metric('Inspeção de ventilador',tag('Regular'))+metric('Entrega de painéis',tag('Atenção'))+metric('Acesso a plataformas',tag('Regular')))}</div>${card('Registro de restrições','Ocorrências e respostas',table(['Restrição','Área','Criticidade','Ação'],[['Sequência de içamento','Montagem',tag('Crítico'),'Revisar janelas'],['Entrega de inversores','Suprimentos',tag('Crítico'),'Antecipar expedição'],['Interface de dutos','Engenharia',tag('Atenção'),'Compatibilizar desenho'],['Liberação de pintura','Qualidade',tag('Atenção'),'Inspeção conjunta']]))}`}
function handover(){return `<div class="grid kpis">${kpi('Sistemas mapeados','9','Pacotes de comissionamento')}${kpi('Pré-requisitos liberados','3','Liberações parciais')}${kpi('Testes programados','24','Procedimentos de campo')}${kpi('Prontidão global','18%','Preparação da partida','warning')}</div><div class="grid equal">${card('Preparação por sistema','Percentual de prontidão',bars([['Estruturas',82],['Corpo filtrante',56],['Dutos',43],['Ventilação',32],['Elétrica',21],['Automação',12]]))}${card('Sequência de partida','Etapas planejadas',metric('Inspeção mecânica','Jan/2027')+metric('Teste de estanqueidade','Jan/2027')+metric('Energização e intertravamentos','Fev/2027')+metric('Teste operacional','Fev/2027'))}</div>${card('Checklist de entrega','Requisitos e verificações',table(['Verificação','Disciplina','Situação'],[['As built mecânico','Engenharia',tag('Atenção')],['Certificados de calibração','Instrumentação',tag('Pendente')],['Inspeção de mangas','Mecânica',tag('Pendente')],['Procedimento de partida','Operação',tag('Regular')]]))}`}
const pages={overview,model,schedule,progress,engineering,supply,quality,safety,cost,risks,handover};function render(){document.querySelector('#nav').innerHTML=navs.map((n,i)=>`${i===0?'<div class="group">VISÃO EXECUTIVA</div>':i===2?'<div class="group">CONTROLES DE PROJETO</div>':i===6?'<div class="group">GARANTIA E ENTREGA</div>':''}<button class="nav ${current===n[0]?'on':''}" data-page="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join('');document.querySelector('#title').textContent=navs.find(n=>n[0]===current)[2];document.querySelector('#page').innerHTML=pages[current]();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{current=b.dataset.page;render();window.scrollTo(0,0)});if(current==='model')setupModel()}
document.querySelector('#period').onchange=e=>{period=+e.target.value;render()};
// Modelo paramétrico vetorial: projeção isométrica 3D, com órbita, zoom, seleção e vista explodida.
function project(x,y,z){let a=angle*Math.PI/180,t=tilt*Math.PI/180,xx=x*Math.cos(a)-y*Math.sin(a),yy=x*Math.sin(a)+y*Math.cos(a);return [410+xx*zoom*21,240+(yy*Math.sin(t)-z*Math.cos(t))*zoom*21]}
function face(points,fill,stroke='#668a7e',opacity=1){return `<polygon points="${points.map(p=>project(...p).join(',')).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="1.3" opacity="${opacity}" stroke-linejoin="round"/>`}
function line3(a,b,color='#92c2a8',width=2){let x=project(...a),y=project(...b);return `<line x1="${x[0]}" y1="${x[1]}" x2="${y[0]}" y2="${y[1]}" stroke="${color}" stroke-width="${width}"/>`}
function box3(x,y,z,w,d,h,color='#5b897f'){let a=[x,y,z],b=[x+w,y,z],c=[x+w,y+d,z],e=[x,y+d,z],A=[x,y,z+h],B=[x+w,y,z+h],C=[x+w,y+d,z+h],E=[x,y+d,z+h];return face([a,b,B,A],color)+face([b,c,C,B],'#416b66')+face([e,c,C,E],'#355d58')+face([A,B,C,E],'#85b4a4')}
function cylinder(cx,cy,z,r,h,color='#789f91'){let seg=14,s='';for(let i=0;i<seg;i++){let a=i*2*Math.PI/seg,b=(i+1)*2*Math.PI/seg;s+=face([[cx+r*Math.cos(a),cy+r*Math.sin(a),z],[cx+r*Math.cos(b),cy+r*Math.sin(b),z],[cx+r*Math.cos(b),cy+r*Math.sin(b),z+h],[cx+r*Math.cos(a),cy+r*Math.sin(a),z+h]],i%2?'#527f72':color)}let top=Array.from({length:seg},(_,i)=>[cx+r*Math.cos(i*2*Math.PI/seg),cy+r*Math.sin(i*2*Math.PI/seg),z+h]);return s+face(top,'#b5d4b7')}
function drawModel(){let s=`<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#48645a" stroke-width=".7" opacity=".4"/></pattern></defs><rect width="820" height="460" fill="url(#grid)"/>`;let show=p=>selected==='all'||selected===p;let ex=exploded?2.1:0;s+=face([[-8,-5,-.2],[9,-5,-.2],[9,6,-.2],[-8,6,-.2]],'#28423d','#4d6c60',.65);if(show('housing')||show('all')){for(let x of [-4,4])for(let y of [-2.2,2.2]){s+=box3(x-.13,y-.13,0,.26,.26,9,'#70998a')}s+=box3(-4.5,-2.5,4+ex,9,5,4.4,'#56847a');for(let i=0;i<4;i++){s+=line3([-4.5,-2.5+i*1.25,4+ex],[-4.5,2.5,4+ex],'#89b5a6',.8)}s+=box3(-4.7,-2.7,8.4+ex,9.4,5.4,.45,'#a0c7ad');for(let i=0;i<4;i++)s+=box3(-3.6+i*2.1,-2.58,6.3+ex,1.5,.16,.45,'#b5d4b7');for(let i=0;i<3;i++)s+=line3([-4.5,-2.6,4.8+i*.8],[4.5,-2.6,4.8+i*.8],'#91c1b1',1)}if(show('hopper')||show('all')){for(let x of [-2.3,2.3]){let z=4-ex;s+=face([[x-2.2,-2.5,z],[x+2.2,-2.5,z],[x+.8,-.8,1.5-ex],[x-.8,-.8,1.5-ex]],'#688d7b');s+=face([[x+2.2,-2.5,z],[x+2.2,2.5,z],[x+.8,.8,1.5-ex],[x+.8,-.8,1.5-ex]],'#4e766b');s+=face([[x-2.2,2.5,z],[x+2.2,2.5,z],[x+.8,.8,1.5-ex],[x-.8,.8,1.5-ex]],'#426b60');s+=box3(x-.75,-.75,.8-ex,1.5,1.5,.7,'#a4b78a')}}if(show('duct')||show('all')){s+=box3(4.5,-1.1,5+ex,3.7,2.2,1.8,'#6b9d8e');s+=box3(-8,-1,5.2+ex,3.5,2,1.4,'#769b8c');s+=box3(6.5,-.7,4.2+ex,1.4,1.4,1.2,'#8db09e')}if(show('fan')||show('all')){s+=cylinder(8.7,.2,1.3-ex,1.25,2.3,'#5c9b8a');s+=box3(7.1,-1.8,.3-ex,3.1,3.6,.8,'#547f71');s+=cylinder(8.7,.2,3.6-ex,.55,.4,'#d2db9c')}for(let z of [2.5,4.4]){s+=line3([-5,-3,z],[5,-3,z],'#c6d998',1.4);s+=line3([-5,-3,z],[-5,3,z],'#c6d998',1.4)}s+=`<text x="20" y="30" fill="#c9ef72" font-size="12" font-weight="700">FM-240 / CONJUNTO DE FILTRAGEM</text><text x="20" y="48" fill="#a6c1b4" font-size="10">Vista técnica interativa • geometria esquemática</text>`;document.querySelector('#modelSvg').innerHTML=s}
function setupModel(){document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{selected=b.dataset.part;document.querySelectorAll('[data-part]').forEach(x=>x.classList.toggle('active',x===b));drawModel()});document.querySelector('#explode').onclick=e=>{exploded=!exploded;e.target.classList.toggle('active',exploded);drawModel()};document.querySelector('#reset').onclick=()=>{angle=-24;tilt=12;zoom=1;exploded=false;selected='all';setupModel();};let wrap=document.querySelector('#modelWrap'),drag=false,lastX=0,lastY=0;wrap.onpointerdown=e=>{drag=true;lastX=e.clientX;lastY=e.clientY;wrap.setPointerCapture(e.pointerId)};wrap.onpointerup=()=>drag=false;wrap.onpointermove=e=>{if(!drag)return;angle+=(e.clientX-lastX)*.45;tilt=Math.max(-28,Math.min(42,tilt+(e.clientY-lastY)*.25));lastX=e.clientX;lastY=e.clientY;drawModel()};wrap.onwheel=e=>{e.preventDefault();zoom=Math.max(.55,Math.min(1.9,zoom+(e.deltaY<0?.08:-.08)));drawModel()};drawModel()}
render();
</script></body></html>
