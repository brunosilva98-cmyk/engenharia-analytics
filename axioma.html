main{margin-left:240px;padding:27px 31px;max-width:1800px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--cyan);font-weight:700;text-transform:uppercase}.top h1{font-size:28px;margin:7px 0 5px;letter-spacing:-.6px}.sub{color:var(--muted);font-size:13px}.topright{display:flex;align-items:center;gap:10px}.pill{background:#142d45;border:1px solid #255576;color:#8be5ee;padding:9px 12px;border-radius:30px;font-size:11px;font-weight:700}.select{background:#172944;color:#eaf2ff;border:1px solid var(--line);padding:9px 12px;border-radius:9px}.hero{background:radial-gradient(circle at 85% 25%,#1752aa 0,transparent 28%),linear-gradient(110deg,#142951,#0c1c37);border:1px solid #24466f;border-radius:18px;padding:25px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}.hero h2{margin:5px 0 8px;font-size:25px}.hero p{margin:0;color:#b1c6e1}.herostat{font-size:32px;font-weight:800;color:var(--cyan);text-align:right}.herostat small{display:block;color:#a3b9d3;font-size:11px;font-weight:500;margin-top:4px}.grid{display:grid;gap:15px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.cols2{grid-template-columns:1.6fr 1fr;margin-bottom:16px}.colsEqual{grid-template-columns:1fr 1fr;margin-bottom:16px}.cols3{grid-template-columns:repeat(3,1fr);margin-bottom:16px}.card{background:linear-gradient(155deg,#14233f,#101b31);border:1px solid var(--line);border-radius:16px;padding:19px;min-width:0;overflow:hidden}.kpi{position:relative;min-height:116px}.kpi:after{content:"";position:absolute;right:-30px;top:-30px;width:95px;height:95px;border-radius:50%;background:radial-gradient(circle,#2774cc33,transparent 70%)}.klabel{font-size:11px;color:var(--muted);margin-bottom:11px}.kvalue{font-size:27px;font-weight:800;letter-spacing:-.5px}.kdetail{font-size:11px;color:#80756F;margin-top:8px}.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}.blue{color:var(--cyan)}.card h3{font-size:14px;margin:0 0 5px;font-weight:750}.card .hint{font-size:11px;color:var(--muted);margin:0 0 18px}.chart{width:100%;height:280px;display:block;overflow:visible}.chart.small{height:215px}.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;color:#b4c4db;font-size:11px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:540px}th{text-align:left;color:#8da5c6;text-transform:uppercase;letter-spacing:.6px;font-size:10px;font-weight:700;background:#172945}td,th{padding:12px 11px;border-bottom:1px solid #243853}td{font-size:12px;color:#d7e4f5}tr:hover td{background:#182c48}.tag{display:inline-block;padding:5px 9px;border-radius:7px;background:#18364a;color:#65e0b5;font-size:10px;font-weight:700}.tag.alert{background:#422438;color:#ff9ba8}.tag.mid{background:#453a25;color:#ffd08b}.progress{height:7px;background:#283b58;border-radius:8px;overflow:hidden;min-width:65px}.progress>div{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--blue),var(--cyan))}.section{display:none}.section.active{display:block}.bars{display:grid;gap:15px}.barrow{display:grid;grid-template-columns:145px 1fr 55px;align-items:center;gap:12px;font-size:12px}.bartrack{height:10px;background:#263c5a;border-radius:8px;overflow:hidden}.barfill{height:100%;border-radius:8px;background:linear-gradient(90deg,#2f8eff,#23d3ec)}.metricrow{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:13px 0;color:#b6c8e1;font-size:12px}.metricrow strong{color:#eaf2ff}.note{font-size:11px;color:#7f99ba;margin-top:13px;line-height:1.6}.gantt{overflow:auto}.gantt table{min-width:880px}.gantt th:nth-child(n+3),.gantt td:nth-child(n+3){text-align:center}.ganttbar{height:10px;border-radius:10px;background:linear-gradient(90deg,#B66A3C,#20d3ee);min-width:25px}.ganttbar.late{background:linear-gradient(90deg,#f59e68,#C45E62)}.footer{color:#607da5;font-size:11px;margin:25px 0 5px;text-align:right}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.cols2,.colsEqual,.cols3{grid-template-columns:1fr}}@media(max-width:740px){aside{position:relative;width:100%;padding:13px}.brand-sub,.navlabel,.sidefoot{display:none}.navlist{display:flex;overflow:auto}.nav{white-space:nowrap;font-size:11px;padding:9px}.nav .sym{display:none}main{margin:0;padding:16px}.top{align-items:flex-start;flex-direction:column}.hero{padding:18px}.hero h2{font-size:20px}.herostat{font-size:22px}.kpis{gap:9px}.card{padding:14px}.kvalue{font-size:23px}}

</head><body>
<aside><div class="brand">AXI<i>O</i>MA</div><div class="brand-sub">PROJECT INTELLIGENCE</div><div class="navlabel">GESTÃO INTEGRADA</div><div class="navlist" id="nav"></div><div class="sidefoot">AMBIENTE DE ANÁLISE<br>Operações • Engenharia • Performance<br><span style="color:#9C5C55">●</span> Base local disponível</div></aside>
<main><div class="top"><div><div class="eyebrow">Central de controle • 2026</div><h1 id="pagetitle">Visão estratégica</h1><div class="sub">Projeto Horizonte • Complexo Industrial Integrado</div></div><div class="topright"><span class="pill">● BASE CONSOLIDADA</span><select class="select" id="period"><option value="10">Outubro / 2026</option><option value="9">Setembro / 2026</option><option value="8">Agosto / 2026</option></select></div></div>

<script>
'use strict';
const C={blue:'#B66A3C',cyan:'#9C5C55',green:'#4F8B75',amber:'#D49A42',red:'#C45E62',grid:'#DED5CB',text:'#80756F'};
const project={name:'Projeto Horizonte',scope:'Complexo Industrial Integrado',contract:48.6,start:'2026-02-02',end:'2027-02-26'};
const phases=[
{name:'Engenharia',weight:12,plan:100,actual:100},
{name:'Terraplenagem',weight:11,plan:100,actual:100},
{name:'Fundações',weight:17,plan:100,actual:97},
{name:'Estruturas',weight:22,plan:83,actual:77},
{name:'Instalações',weight:19,plan:57,actual:50},
{name:'Montagem mecânica',weight:13,plan:34,actual:30},
{name:'Comissionamento',weight:6,plan:0,actual:0}
];
const tasks=[
['Mobilização e canteiro','Infraestrutura','02/02','20/02',100,'Concluída'],
['Projetos executivos','Engenharia','02/02','29/05',100,'Concluída'],
['Terraplenagem e drenagem','Civil','16/02','24/04',100,'Concluída'],
['Estacas e blocos','Civil','16/03','10/07',97,'Em conclusão'],
['Estruturas metálicas','Montagem','04/05','18/12',77,'Em execução'],
['Coberturas e fechamentos','Montagem','06/07','15/01',65,'Em execução'],
['Infraestrutura elétrica','Elétrica','01/06','29/01',54,'Em execução'],
['Redes hidráulicas','Utilidades','15/06','05/02',48,'Em execução'],
['Montagem de equipamentos','Mecânica','03/08','12/02',30,'Em execução'],
['Instrumentação e automação','Automação','05/10','19/02',12,'Em execução'],
['Testes integrados','Comissionamento','11/01','26/02',0,'A iniciar']
];
const docs=[['Civil',86,81],['Mecânica',74,69],['Elétrica',62,57],['Automação',45,42],['Segurança',28,28]];
const suppliers=[['Estruturas metálicas','Em fabricação',84],['Painéis elétricos','Entrega programada',72],['Bombas de processo','Em trânsito',92],['Válvulas industriais','Acompanhamento',68],['Instrumentação','Pedido confirmado',58]];
const months=['Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez','Jan','Fev'];
const plan=[2,6,12,20,29,39,49,59,68,79,89,96,100];
const actual=[2,6,11,19,27,36,45,54,63];
const revPlan=[1,4,9,16,25,35,45,56,67,78,88,96,100];
const revActual=[1,4,8,15,23,32,41,51,61];
const navs=[['overview','◈','Visão estratégica'],['physical','◫','Evolução física'],['financial','◉','Performance financeira'],['engineering','◇','Engenharia'],['resources','▥','Recursos e equipes'],['supply','▣','Cadeia de suprimentos'],['schedule','▤','Plano de execução'],['risks','⚑','Pontos de atenção']];
let current='overview',period=10;
const fmt=(n,d=1)=>Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(arr,i)=>arr[Math.min(i,arr.length-1)];
const kpi=(label,value,detail='',tone='blue')=>`<div class="card kpi"><div class="klabel">${label}</div><div class="kvalue ${tone}">${value}</div><div class="kdetail">${detail}</div></div>`;
const card=(title,hint,body)=>`<div class="card"><h3>${title}</h3><p class="hint">${hint}</p>${body}</div>`;
const table=(headers,rows)=>`<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const tag=(s)=>`<span class="tag ${/Atras|Crít|Pendente/.test(s)?'alert':/Aten|Em conclusão/.test(s)?'mid':''}">${s}</span>`;
const prog=(n)=>`<div style="display:flex;align-items:center;gap:8px"><div class="progress" style="flex:1"><div style="width:${Math.min(n,100)}%"></div></div><b>${n}%</b></div>`;
function lineChart(series,labels=months,height=280,max=100){const w=740,h=height,p={l:43,r:15,t:18,b:33},W=w-p.l-p.r,H=h-p.t-p.b;let out=`<svg class="chart" style="height:${height}px" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">`;for(let i=0;i<=4;i++){let y=p.t+H*i/4;out+=`<line x1="${p.l}" y1="${y}" x2="${w-p.r}" y2="${y}" stroke="${C.grid}" stroke-dasharray="3 5"/><text x="${p.l-9}" y="${y+4}" text-anchor="end" fill="${C.text}" font-size="11">${fmt(max*(4-i)/4,0)}</text>`}labels.forEach((v,i)=>{let x=p.l+i*W/(labels.length-1);out+=`<text x="${x}" y="${h-9}" text-anchor="middle" fill="${C.text}" font-size="11">${v}</text>`});series.forEach((s,si)=>{let points=s.values.map((v,i)=>[p.l+i*W/(labels.length-1),p.t+H*(1-v/max)]);let d=points.map((q,i)=>(i?'L':'M')+q.join(',')).join(' ');if(si===0){let area=d+` L${points.at(-1)[0]},${p.t+H} L${p.l},${p.t+H} Z`;out+=`<path d="${area}" fill="${s.color}" opacity=".09"/>`}out+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;points.forEach(q=>out+=`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="${s.color}" stroke="#FFFCF7" stroke-width="1.5"/>`)});return out+'</svg>'}
function barChart(labels,values,colors=[C.blue],height=250){let w=740,h=height,p={l:40,r:15,t:15,b:38},W=w-p.l-p.r,H=h-p.t-p.b,max=Math.max(...values)*1.17;let out=`<svg class="chart" style="height:${h}px" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">`;for(let i=0;i<4;i++){let y=p.t+H*i/3;out+=`<line x1="${p.l}" y1="${y}" x2="${w-p.r}" y2="${y}" stroke="${C.grid}" stroke-dasharray="3 5"/>`}values.forEach((v,i)=>{let x=p.l+(i+.2)*W/values.length,bw=.6*W/values.length,bh=v/max*H;out+=`<rect x="${x}" y="${p.t+H-bh}" width="${bw}" height="${bh}" rx="5" fill="${colors[i%colors.length]}"/><text x="${x+bw/2}" y="${p.t+H-bh-7}" text-anchor="middle" fill="#66574D" font-size="11">${fmt(v,0)}</text><text x="${x+bw/2}" y="${h-10}" text-anchor="middle" fill="${C.text}" font-size="11">${labels[i]}</text>`});return out+'</svg>'}
const legend=(entries)=>`<div class="legend">${entries.map(e=>`<span><i class="dot" style="background:${e[1]}"></i>${e[0]}</span>`).join('')}</div>`;
function overview(){let p=period===10?8:period===9?7:6;let a=actual[p],b=plan[p],delta=a-b;return `<div class="hero"><div><div class="eyebrow">Portfólio em foco • HZ-026</div><h2>Complexo Industrial Integrado</h2><p>Implantação civil, estruturas, utilidades e montagem eletromecânica</p></div><div class="herostat">${fmt(a)}%<small>Avanço físico acumulado</small></div></div>
<div class="grid kpis">${kpi('Avanço previsto',fmt(b)+'%','Linha de base contratual')}${kpi('Avanço realizado',fmt(a)+'%',`Desvio ${fmt(delta)} p.p.`,'cyan')}${kpi('Valor do empreendimento','R$ 48,6 mi','Orçamento referencial')}${kpi('Prazo remanescente','4 meses','Conclusão prevista: fev/2027','warn')}</div>
<div class="grid cols2">${card('Evolução consolidada','Curva física acumulada • previsto × realizado',lineChart([{values:plan.slice(0,p+1),color:C.blue},{values:actual.slice(0,p+1),color:C.cyan}],months.slice(0,p+1))+legend([['Planejado',C.blue],['Executado',C.cyan]]))}${card('Distribuição por disciplina','Execução atual das principais frentes',`<div class="bars">${phases.slice(0,6).map(x=>`<div class="barrow"><span>${x.name}</span><div class="bartrack"><div class="barfill" style="width:${x.actual}%"></div></div><b>${x.actual}%</b></div>`).join('')}</div>`)}</div>
<div class="grid colsEqual">${card('Produção mensal','Avanço incremental por competência',barChart(months.slice(0,p+1),actual.slice(0,p+1).map((x,i)=>x-(actual[i-1]||0)),[C.blue,C.cyan],230))}${card('Leitura gerencial','Principais observações do período',`<div class="metricrow"><span>Desvio físico acumulado</span><strong class="bad">${fmt(delta)} p.p.</strong></div><div class="metricrow"><span>Frentes em execução</span><strong>5 disciplinas</strong></div><div class="metricrow"><span>Documentação técnica emitida</span><strong>298 documentos</strong></div><div class="metricrow"><span>Equipamentos críticos monitorados</span><strong>4 pacotes</strong></div><p class="note">Prioridade operacional: acelerar estruturas, instalações e montagem, preservando a sequência de comissionamento.</p>`)}</div>`}
function physical(){let p=period===10?8:period===9?7:6;return `<div class="grid kpis">${kpi('Meta acumulada',plan[p]+'%','Referência do período')}${kpi('Executado',actual[p]+'%','Medição física ponderada','cyan')}${kpi('Variação',fmt(actual[p]-plan[p])+' p.p.','Diferença frente à linha de base','bad')}${kpi('Ritmo recente','9 p.p.','Incremento no último mês','good')}</div><div class="grid cols2">${card('Curva S de avanço físico','Acompanhamento da trajetória global',lineChart([{values:plan,color:C.blue},{values:actual.slice(0,p+1),color:C.cyan}])+legend([['Previsto',C.blue],['Realizado',C.cyan]]))}${card('Desempenho por fase','Avanço planejado e realizado',`<div class="bars">${phases.map(x=>`<div class="barrow"><span>${x.name}</span><div class="bartrack"><div class="barfill" style="width:${x.actual}%"></div></div><b>${x.actual}%</b></div>`).join('')}</div>`)}</div>${card('Matriz de acompanhamento','Pesos de planejamento e progresso físico por disciplina',table(['Frente','Peso na EAP','Previsto','Executado','Desvio'],phases.map(x=>[x.name,x.weight+'%',x.plan+'%',prog(x.actual),`<span class="${x.actual-x.plan<0?'bad':'good'}">${x.actual-x.plan} p.p.</span>`])))}` }
function financial(){let p=period===10?8:period===9?7:6;let a=revActual[p],b=revPlan[p];return `<div class="grid kpis">${kpi('Contrato referencial','R$ 48,6 mi','Valor global')}${kpi('Receita prevista','R$ '+fmt(48.6*b/100)+' mi',b+'% do contrato')}${kpi('Receita acumulada','R$ '+fmt(48.6*a/100)+' mi',a+'% do contrato','cyan')}${kpi('Desvio de receita',fmt(a-b)+' p.p.','Comparação acumulada','bad')}</div><div class="grid cols2">${card('Curva de receita','Percentual financeiro acumulado',lineChart([{values:revPlan,color:C.blue},{values:revActual.slice(0,p+1),color:C.green}])+legend([['Previsto',C.blue],['Realizado',C.green]]))}${card('Receita por competência','Valores realizados em R$ milhões',barChart(months.slice(0,p+1),revActual.slice(0,p+1).map((x,i)=>+(48.6*(x-(revActual[i-1]||0))/100).toFixed(1)),[C.blue,C.cyan,C.green]))}</div>${card('Visão contratual','Distribuição ilustrativa do orçamento por pacote',table(['Pacote','Participação','Valor (R$ mi)','Medição acumulada'],[['Engenharia','12%','5,8','100%'],['Obras civis','28%','13,6','91%'],['Estruturas','22%','10,7','70%'],['Instalações','19%','9,2','47%'],['Montagem','13%','6,3','27%'],['Comissionamento','6%','2,9','0%']]))}` }
function engineering(){return `<div class="grid kpis">${kpi('Documentos planejados','325','Todas as disciplinas')}${kpi('Documentos emitidos','298','91,7% do previsto','cyan')}${kpi('Aprovados','267','89,6% dos emitidos','good')}${kpi('Em análise','31','Fluxo de comentários','warn')}</div><div class="grid cols2">${card('Documentação por disciplina','Quantidade prevista × emitida',barChart(docs.map(x=>x[0]),docs.map(x=>x[2]),[C.blue,C.cyan,C.green],260))}${card('Situação documental','Volumes por estágio de aprovação',barChart(['Aprovados','Em análise','A revisar'],[267,31,27],[C.green,C.blue,C.amber],260))}</div>${card('Controle de entregáveis','Evolução da emissão técnica',table(['Disciplina','Previstos','Emitidos','Atendimento','Situação'],docs.map(x=>[x[0],x[1],x[2],prog(Math.round(100*x[2]/x[1])),tag(x[2]/x[1]>.94?'Regular':'Atenção')])))}` }
function resources(){let crews=[['Civil',78,71],['Montagem',96,88],['Elétrica',54,50],['Mecânica',63,57],['Apoio',29,28]];return `<div class="grid kpis">${kpi('Efetivo mobilizado','294','Colaboradores em campo')}${kpi('Efetivo planejado','320','Referência operacional')}${kpi('HH acumulado','318.400','Horas apropriadas','cyan')}${kpi('Produtividade','91,9%','Efetivo mobilizado / previsto','good')}</div><div class="grid cols2">${card('Histograma de mão de obra','Distribuição por disciplina',barChart(crews.map(x=>x[0]),crews.map(x=>x[2]),[C.blue,C.cyan,C.green],270))}${card('Mobilização por equipe','Efetivo atual frente à referência',`<div class="bars">${crews.map(x=>`<div class="barrow"><span>${x[0]}</span><div class="bartrack"><div class="barfill" style="width:${100*x[2]/x[1]}%"></div></div><b>${x[2]}</b></div>`).join('')}</div>`)}</div>${card('Apropriação por equipe','Referências operacionais do período',table(['Equipe','Planejado','Mobilizado','Atendimento','Status'],crews.map(x=>[x[0],x[1],x[2],prog(Math.round(100*x[2]/x[1])),tag(x[2]/x[1]>.94?'Regular':'Atenção')])))}` }
function supply(){return `<div class="grid kpis">${kpi('Pacotes monitorados','24','Suprimentos críticos')}${kpi('Pedidos emitidos','21','87,5% do total','cyan')}${kpi('Entregas concluídas','15','62,5% dos pacotes','good')}${kpi('Pontos de atenção','3','Itens com risco de prazo','warn')}</div><div class="grid cols2">${card('Maturidade de fornecimento','Progresso dos principais pacotes',`<div class="bars">${suppliers.map(x=>`<div class="barrow"><span>${x[0]}</span><div class="bartrack"><div class="barfill" style="width:${x[2]}%"></div></div><b>${x[2]}%</b></div>`).join('')}</div>`)}${card('Situação das entregas','Distribuição dos pacotes por estágio',barChart(['Recebido','Em trânsito','Fabricação','Pedido'],[15,3,4,2],[C.green,C.cyan,C.blue,C.amber],250))}</div>${card('Mapa de fornecimento','Acompanhamento de itens estratégicos',table(['Pacote','Situação','Progresso','Classificação'],suppliers.map(x=>[x[0],x[1],prog(x[2]),tag(x[2]<70?'Atenção':'Regular')])))}` }
function schedule(){return `<div class="grid kpis">${kpi('Atividades estruturadas','11','Frentes principais')}${kpi('Atividades concluídas','3','Encerradas ou em conclusão','good')}${kpi('Em execução','7','Mobilização ativa','cyan')}${kpi('Marco final','26/02/2027','Término referencial','warn')}</div>${card('Plano mestre de execução','Atividades, janelas e progresso de produção',`<div class="gantt">${table(['Atividade','Disciplina','Início','Término','Progresso','Status'],tasks.map(x=>[x[0],x[1],x[2],x[3],prog(x[4]),tag(x[5])]))}</div>`)}<div class="grid colsEqual" style="margin-top:16px">${card('Sequência de marcos','Entregas previstas',`<div class="metricrow"><span>Conclusão das fundações</span><strong>Nov/2026</strong></div><div class="metricrow"><span>Fechamento estrutural</span><strong>Jan/2027</strong></div><div class="metricrow"><span>Início dos testes integrados</span><strong>Jan/2027</strong></div><div class="metricrow"><span>Entrega operacional</span><strong>Fev/2027</strong></div>`)}${card('Estratégia de recuperação','Ações de curto prazo',`<div class="metricrow"><span>Reforço da equipe de montagem</span><strong class="blue">Em curso</strong></div><div class="metricrow"><span>Antecipação de materiais elétricos</span><strong class="good">Confirmada</strong></div><div class="metricrow"><span>Revisão de sequenciamento</span><strong class="warn">Em análise</strong></div>`)}</div>`}
function risks(){let risks=[['Interferências de montagem','Estruturas','Alta','Plano de frentes paralelas'],['Entrega de painéis','Suprimentos','Média','Inspeção antecipada'],['Liberação de áreas técnicas','Civil','Média','Revisão semanal de interfaces'],['Disponibilidade de equipamentos','Mecânica','Baixa','Reserva de capacidade'],['Integração de automação','Automação','Média','Testes por subsistema']];return `<div class="grid kpis">${kpi('Riscos ativos','5','Registro consolidado')}${kpi('Alta prioridade','1','Tratativa imediata','bad')}${kpi('Média prioridade','3','Acompanhamento semanal','warn')}${kpi('Baixa prioridade','1','Monitoramento','good')}</div><div class="grid colsEqual">${card('Mapa de exposição','Quantidade por severidade',barChart(['Alta','Média','Baixa'],[1,3,1],[C.red,C.amber,C.green],245))}${card('Plano de resposta','Diretrizes operacionais',`<div class="metricrow"><span>Revisão de restrições</span><strong>Semanal</strong></div><div class="metricrow"><span>Atualização de planos de ação</span><strong>Quinzenal</strong></div><div class="metricrow"><span>Escalonamento gerencial</span><strong>Por criticidade</strong></div><div class="metricrow"><span>Validação de marcos</span><strong>Mensal</strong></div>`)}</div>${card('Registro de riscos','Ações e classificação gerencial',table(['Ocorrência','Disciplina','Prioridade','Resposta'],risks.map(x=>[x[0],x[1],tag(x[2]==='Alta'?'Crítica':x[2]==='Média'?'Atenção':'Regular'),x[3]])))}` }
const views={overview,physical,financial,engineering,resources,supply,schedule,risks};
function render(){document.querySelector('#nav').innerHTML=navs.map(([id,ico,label])=>`<button class="nav ${id===current?'active':''}" data-page="${id}"><span class="sym">${ico}</span>${label}</button>`).join('');document.querySelector('#pagetitle').textContent=navs.find(x=>x[0]===current)[2];document.querySelector('#content').innerHTML=`<section class="section active">${views[current]()}</section>`;document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.page;render();window.scrollTo(0,0)}))}
document.querySelector('#period').addEventListener('change',e=>{period=Number(e.target.value);render()});render();
</script></body></html>
